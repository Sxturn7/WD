<!--
  Supabase Dashboard → Authentication → Email Templates → Magic Link
  Replace the ENTIRE body with this HTML.
  The {{ .Token }} variable is what renders the 6-digit OTP code.
-->
<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;max-width:480px;margin:0 auto;padding:40px 24px;background:#ffffff;">
  <div style="text-align:center;margin-bottom:32px;">
    <div style="display:inline-block;background:#18181b;border-radius:10px;padding:10px 18px;">
      <span style="color:#ffffff;font-size:14px;font-weight:700;letter-spacing:0.05em;">SAC</span>
    </div>
    <h1 style="margin:16px 0 4px;font-size:20px;font-weight:600;color:#09090b;">IPM SAC Treasury Portal</h1>
    <p style="margin:0;font-size:14px;color:#71717a;">Email verification code</p>
  </div>

  <div style="background:#f4f4f5;border-radius:12px;padding:32px;text-align:center;margin-bottom:24px;">
    <p style="margin:0 0 16px;font-size:13px;color:#52525b;">Enter this code to verify your email. Expires in 1 hour.</p>
    <p style="margin:0;font-size:40px;font-weight:700;letter-spacing:0.3em;color:#09090b;font-family:'Courier New',monospace;">{{ .Token }}</p>
  </div>

  <p style="font-size:12px;color:#a1a1aa;text-align:center;margin:0;">
    If you didn't request this, ignore this email.<br/>This code can only be used once.
  </p>
</div>
